<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
    <title>Magical Characters</title>
  </head>
  <body>
    <header><h1>Magical Characters</h1></header>
    <div class="filter-characters">
      <label id="label-character" for="">filter character by house!</label>
      <select name="characters-filteration" id="filteration" required>
        <option value="" disabled selected hidden>Choose a house</option>
        <option value="all houses">All houses</option>
        <option value="Gryffindor">Gryffindor</option>
        <option value="Slytherin">Slytherin</option>
        <option value="Hufflepuff">Hufflepuff</option>
        <option value="Ravenclaw">Ravenclaw</option>
      </select>
    </div>

    <main>
      <div id="display-characters"></div>
      <button id="load-more">Load More</button>
    </main>
    <footer>baraa.2025</footer>
    <script src="js/app.js"></script>
  </body>
</html>
